services:
  - type: web
    name: imentor-backend
    runtime: node
    rootDir: server
    buildCommand: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm install
    startCommand: node server.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SGLANG_ENABLED
        value: "false"
      - key: FRONTEND_URL
        value: https://frontend-two-pink-72.vercel.app
