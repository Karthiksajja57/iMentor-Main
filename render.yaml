services:
  - type: web
    name: imentor-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SGLANG_ENABLED
        value: "false"
      - key: FRONTEND_URL
        value: https://frontend-two-pink-72.vercel.app
